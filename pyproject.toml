[project]
name = "ptcg"
version = "0.1.0"
description = "PTCG AI Battle Challenge agent + evaluation harness"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: long-running acceptance series (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
